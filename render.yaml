# Render Blueprint for Collectra (mobile web app). Upload to GitHub, then on Render: New > Blueprint.
services:
  - type: web
    name: collectra-app
    runtime: python
    plan: starter         # paid plan: needed for the permanent disk below (free plan resets data on every restart)
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COLLECTRA_ADMIN_KEY
        generateValue: true
      - key: COLLECTRA_SECRET
        generateValue: true
      - key: COLLECTRA_DATA_DIR
        value: /var/data
      - key: COLLECTRA_AUTO_APPROVE_SELLERS
        value: "on"
      - key: COLLECTRA_ANON_VERIFY
        value: "on"
      - key: COLLECTRA_ANON_PER_HOUR
        value: "100"
      - key: COLLECTRA_ANON_PER_DAY
        value: "1000"
      - key: COLLECTRA_ANON_MAX_MB
        value: "30"
      - key: COLLECTRA_WEB_AI
        value: "on"
      - key: COLLECTRA_WEB_AI_URL
        value: https://collectra-marketplace.vercel.app
      - key: COLLECTRA_AI_PROVIDER
        value: claude
      - key: COLLECTRA_AI_FALLBACKS
        value: openai
    disk:
      name: collectra-data
      mountPath: /var/data
      sizeGB: 1
