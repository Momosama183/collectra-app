# Render Blueprint for Collectra (mobile web app). Upload to GitHub, then on Render: New > Blueprint.
services:
  - type: web
    name: collectra-app
    runtime: python
    plan: free            # free = data resets when the server sleeps/restarts. See below for permanent storage.
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: COLLECTRA_ADMIN_KEY
        generateValue: true
      - key: COLLECTRA_SECRET
        generateValue: true
      - key: COLLECTRA_WEB_AI
        value: "on"
      - key: COLLECTRA_WEB_AI_URL
        value: https://collectra-marketplace.vercel.app
      - key: COLLECTRA_AI_PROVIDER
        value: claude
      - key: COLLECTRA_AI_FALLBACKS
        value: openai
    # --- For PERMANENT data (needs a paid plan, about $7/month): change plan to "starter", delete the "#" below ---
    # disk:
    #   name: collectra-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add this env var:  COLLECTRA_DATA_DIR = /var/data
